name: Temporary encrypted studio artifact
on:
  push:
    branches: [studio-encrypted-transfer-20260922]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch encrypted production payload
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 3 "https://raw.githubusercontent.com/$REPO/$COMMIT/studio_payload.enc" -o studio_payload.enc
          echo "f8ce6cb85892c1522ea82617d11ec3506acbcdd3bda196948b39400152cc8eac  studio_payload.enc" | sha256sum -c -
      - uses: actions/upload-artifact@v7
        with:
          name: neon-encrypted-production
          path: studio_payload.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
